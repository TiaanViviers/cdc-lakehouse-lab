services:
  source-db:
    profiles: [source]
    image: docker.io/library/postgres:16.16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37
    pull_policy: never
    environment:
      POSTGRES_USER: source_admin
      POSTGRES_DB: source_lab
      POSTGRES_PASSWORD_FILE: /run/secrets/source_db_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
      - -c
      - password_encryption=scram-sha-256
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=2
      - -c
      - max_replication_slots=2
      - -c
      - max_slot_wal_keep_size=128MB
      - -c
      - wal_keep_size=0
      - -c
      - min_wal_size=32MB
      - -c
      - max_wal_size=128MB
      - -c
      - checkpoint_timeout=5min
      - -c
      - archive_mode=off
      - -c
      - logging_collector=off
      - -c
      - log_connections=on
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          password=$$(cat "$$POSTGRES_PASSWORD_FILE") &&
          PGPASSWORD="$$password" PGREQUIREAUTH=scram-sha-256 PGCONNECT_TIMEOUT=3
          psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
          -XqAtw -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 128
    shm_size: 128m
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '3'
    networks:
      - source-input
    volumes:
      - source-pg:/var/lib/postgresql/data
    secrets:
      - source_db_password

networks:
  source-input:
    external: true
    name: ${SOURCE_INPUT_ID:?set SOURCE_INPUT_ID to the full Engine network ID}

volumes:
  source-pg:

secrets:
  source_db_password:
    file: ./secrets/source-db-password
