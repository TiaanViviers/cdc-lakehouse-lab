name: Research experiment
description: Test one hypothesis and record reproducible evidence
title: "[Experiment] "
labels: []
body:
  - type: input
    id: question
    attributes:
      label: Research question ID(s)
      placeholder: R01, R02
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis and setup
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Reproducible procedure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence and expected observation
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Limitations, cleanup, and failure precautions
