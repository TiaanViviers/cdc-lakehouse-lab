name: Research experiment
description: Test one hypothesis and record reproducible evidence
title: ""
labels: []
body:
  - type: input
    id: ticket_id
    attributes:
      label: Stable phase ticket ID
      description: Prefix the issue TITLE with phase.sequence, e.g. 2.4 Test replication recovery.
      placeholder: "2.4"
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: Research question ID(s)
      placeholder: R01, R02
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis and setup
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Reproducible procedure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence and expected observation
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Limitations, cleanup, and failure precautions
